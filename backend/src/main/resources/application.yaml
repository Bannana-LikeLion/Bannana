spring:
  config:
    import: optional:classpath:application-local.yaml
  application:
    name: backend
  datasource:
    url: jdbc:h2:mem:backend;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
weather:
  kma:
    base-url: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
    service-key: ${KMA_SERVICE_KEY:}
    page-no: 1
    num-of-rows: 1000
    data-type: JSON
kakao:
  local:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    radius: 2000
    size: 10

# ===== 추천 알고리즘 (POST /recommendations) =====
# 카카오 키는 room/place 쪽과 같은 키다. 병합 전 각 서비스가 다른 환경변수 이름을 쓰고 있었어서
# KAKAO_REST_API_KEY를 우선 보고, 없으면 예전 이름인 KAKAO_API_KEY로 넘어간다.
bannana:
  api:
    kakao:
      api-key: ${KAKAO_REST_API_KEY:${KAKAO_API_KEY:}}
      base-url: https://dapi.kakao.com
      connect-timeout: 3s
      read-timeout: 5s
    odsay:
      api-key: ${ODSAY_API_KEY:}
      base-url: https://api.odsay.com
      connect-timeout: 3s
      read-timeout: 6s
    tmap:
      app-key: ${TMAP_APP_KEY:}
      base-url: https://apis.openapi.sk.com
      connect-timeout: 3s
      read-timeout: 6s
  recommendation:
    # 후보 역 개수 (명세: 6~10곳)
    min-candidates: 6
    max-candidates: 10
    # 응답에 담을 후보 수
    top-n: 3
    # 카카오 검색 반경(m). 앞에서부터 시도하다 min-candidates를 채우면 멈춘다.
    search-radii: [3000, 5000, 10000, 20000]
    # auto = 카카오 우선 + 정적 목록 폴백 / kakao / static
    station-provider: auto
    # 이동시간 조회 제공자. tmap | odsay
    # ODsay 일일 한도에 걸려 tmap으로 전환했다. 한도가 리셋되면 odsay로 되돌릴 수 있다.
    travel-time-provider: tmap
    # ODsay 동시 호출 수
    concurrency: 4

logging:
  level:
    com.bannana.backend.recommendation: INFO
    org.springframework.boot.context.config: DEBUG
