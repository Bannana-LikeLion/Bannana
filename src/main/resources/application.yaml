spring:
  application:
    name: backend
  datasource:
    url: jdbc:h2:mem:backend;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
weather:
  kma:
    base-url: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
    service-key: ${KMA_SERVICE_KEY:}
    page-no: 1
    num-of-rows: 1000
    data-type: JSON
kakao:
  local:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    radius: 2000
    size: 10
